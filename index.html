<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected 3D interiors by Valentino Ivanovski. Designed and rendered in Blender.">
    <link rel="icon" type="image/x-icon" href="/aaa.ico">
    <title>Valentino Ivanovski — 3D Interiors</title>
    <link rel="preload" href="fonts/poppins-medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="1.avif" as="image" fetchpriority="high">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="identity-block">
            <img src="pfp.jpg" alt="Valentino Ivanovski" class="profile-pic" width="56" height="56">
            <div class="identity-copy">
                <p class="identity-name">Valentino Ivanovski</p>
                <p class="specialty">3D interior designer in Blender</p>
            </div>
        </div>
        <h1>Spaces imagined.<br>Details considered.</h1>
        <div class="header-details">
            <a class="contact" aria-label="Get in touch" href="mailto:valentino.ivanovski@icloud.com"><span class="button-label" aria-hidden="true"><span class="button-stack"><span>Get in touch.</span><span>Get in touch.</span></span></span></a>
        </div>
    </header>
    <main class="gallery" aria-label="Selected 3D interior renders" aria-roledescription="carousel">
        <div class="slides is-active"><img src="1.avif" alt="Interior render 1" fetchpriority="high"></div>
        <div class="slides"><img src="2.avif" alt="Interior render 2"></div>
        <div class="slides"><img src="3.avif" alt="Interior render 3"></div>
        <div class="slides"><img src="4.avif" alt="Interior render 4"></div>
        <div class="slides"><img src="5.avif" alt="Interior render 5"></div>
        <div class="slides"><img src="6.avif" alt="Interior render 6"></div>
        <div class="slides"><img src="7.avif" alt="Interior render 7"></div>
        <div class="slides"><img src="8.avif" alt="Interior render 8"></div>
        <div class="slides"><img src="9.avif" alt="Interior render 9"></div>
        <div class="slides"><img src="10.avif" alt="Interior render 10"></div>
        <div class="slides"><img src="11.avif" alt="Interior render 11"></div>
        <button class="gallery-arrow gallery-arrow-prev" id="previous-slide" type="button" aria-label="Previous picture">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
        </button>
        <button class="gallery-arrow gallery-arrow-next" id="next-slide" type="button" aria-label="Next picture">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
        </button>
        <div class="gallery-footer">
            <span class="gallery-caption"><span>Selected interiors</span> <span id="slide-count">01 / 11</span></span>
            <button id="playback" type="button" aria-label="Pause slideshow" aria-pressed="false"><span class="button-label" aria-hidden="true"><span class="button-stack"><span>Pause</span><span>Pause</span></span></span></button>
        </div>
    </main>
</body>
</html>
